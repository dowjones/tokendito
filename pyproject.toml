[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313', 'py314']

[tool.coverage.report]
exclude_lines = [
    "break",
    "except KeyboardInterrupt:",
    "if __name__ == .__main__.:",
    "if not __package__:",
    "logger.debug",
    "pragma: no cover",
    "print..Invalid input, try again...",
    ]
